name: release

# Publica una release del agente **sola**, al mergear a `main` un cambio de
# `AgentVersion` en `cloud.go`: si la versión de `main` todavía no tiene su
# tag `agent-vX.Y.Z`, se compila, se prueba y se publica con ese tag. Si ya lo
# tiene, no hace nada. Subir de versión es cambiar esa línea en el PR; nadie
# tiene que acordarse de etiquetar.
#
# También sirve un tag `agent-v*` empujado a mano (tiene que coincidir con
# `cloud.go`) y `workflow_dispatch`, que compila sin publicar.
#
# El install.ps1 de cada release descarga el .exe de ESA release (la URL
# lleva el tag): nunca `latest`, para que una portería quede con la versión
# que se probó contra la plataforma y no con la que se publique mañana.
#
# El SHA-256 del binario Windows (y el del desinstalador) los pone en
# `install.ps1` la herramienta `cmd/publicar-guiones`, que además deja los
# guiones en ASCII puro. Sin firma de código ($300/año), el hash es la mejor
# defensa contra binarios modificados.

on:
  push:
    branches:
      - main
    tags:
      - 'agent-v*'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile + release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      # La versión sale de `cloud.go`, la misma que el binario reporta en cada
      # latido. `publicar` dice si esta corrida crea la release.
      - name: Determinar versión
        id: version
        run: |
          VERSION="$(grep -oP 'var AgentVersion = "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' cloud.go)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::cloud.go no tiene AgentVersion = \"X.Y.Z\""; exit 1
          fi
          PUBLICAR=false
          if [[ "${GITHUB_REF}" == refs/tags/agent-v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/agent-v}" != "$VERSION" ]]; then
              echo "::error::el tag ${GITHUB_REF_NAME} no coincide con AgentVersion ${VERSION} de cloud.go"; exit 1
            fi
            PUBLICAR=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/agent-v${VERSION}" >/dev/null; then
              echo "agent-v${VERSION} ya está publicada: nada que hacer."
            else
              PUBLICAR=true
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publicar=${PUBLICAR}" >> "$GITHUB_OUTPUT"
          echo "versión ${VERSION}, publicar=${PUBLICAR}"

      - name: Go vet
        if: steps.version.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
        run: go vet ./...

      # Incluye las de cmd/publicar-guiones: un guion que no quede en ASCII o
      # que compare contra su propio marcador no llega a publicarse.
      - name: Go test
        if: steps.version.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
        run: go test ./...

      - name: Cross-compile (windows/linux/macos)
        if: steps.version.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p bin
          LDFLAGS="-s -w -X main.AgentVersion=${VERSION}"

          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/porteria-agent.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/porteria-agent-linux-amd64 .
          # Raspberry Pi 3/4/5 con SO de 64 bits: el PC de portería más barato.
          GOOS=linux   GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/porteria-agent-linux-arm64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/porteria-agent-macos-arm64 .

          ls -lah bin/

      - name: Calcular SHA-256
        if: steps.version.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
        id: hashes
        working-directory: bin
        run: |
          WIN_HASH=$(sha256sum porteria-agent.exe | awk '{print $1}')
          LINUX_HASH=$(sha256sum porteria-agent-linux-amd64 | awk '{print $1}')
          ARM_HASH=$(sha256sum porteria-agent-linux-arm64 | awk '{print $1}')
          MAC_HASH=$(sha256sum porteria-agent-macos-arm64 | awk '{print $1}')

          echo "win=${WIN_HASH}" >> "$GITHUB_OUTPUT"
          echo "linux=${LINUX_HASH}" >> "$GITHUB_OUTPUT"
          echo "arm=${ARM_HASH}" >> "$GITHUB_OUTPUT"
          echo "mac=${MAC_HASH}" >> "$GITHUB_OUTPUT"

          cat > SHA256SUMS.txt <<EOF
          ${WIN_HASH}  porteria-agent.exe
          ${LINUX_HASH}  porteria-agent-linux-amd64
          ${ARM_HASH}  porteria-agent-linux-arm64
          ${MAC_HASH}  porteria-agent-macos-arm64
          EOF
          cat SHA256SUMS.txt

      # Versión, hashes y ASCII puro: Windows PowerShell 5.1 lee mal un UTF-8
      # sin BOM, y la v1.7.0 bajada de GitHub no arrancaba (2026-11-20).
      - name: Guiones publicables (install.ps1 + uninstall.ps1)
        if: steps.version.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
        env:
          WIN_HASH: ${{ steps.hashes.outputs.win }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./cmd/publicar-guiones -version "$VERSION" -hash "$WIN_HASH" -src scripts -out bin
          echo "✓ Guiones publicables: ASCII, con versión y hashes"

      # Crea el tag sobre este commit si todavía no existe.
      - name: Publicar release
        if: steps.version.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sync Agent v${{ steps.version.outputs.version }}
          body: |
            Sync agent del Módulo LPR de Porteria Plus.

            **Binarios**:
            - Windows amd64: `porteria-agent.exe` — SHA-256 `${{ steps.hashes.outputs.win }}`
            - Linux amd64: `porteria-agent-linux-amd64` — SHA-256 `${{ steps.hashes.outputs.linux }}`
            - Linux arm64 (Raspberry Pi): `porteria-agent-linux-arm64` — SHA-256 `${{ steps.hashes.outputs.arm }}`
            - macOS arm64: `porteria-agent-macos-arm64` — SHA-256 `${{ steps.hashes.outputs.mac }}`

            **Scripts** (Windows):
            - `install.ps1` — instalación con verificación SHA-256 + AV exclusion + Service register
            - `uninstall.ps1` — desinstalación limpia
            - `SHA256SUMS.txt` — manifest de hashes

            Ver [README](https://github.com/${{ github.repository }}#readme) para detalles de instalación.
          files: |
            bin/porteria-agent.exe
            bin/porteria-agent-linux-amd64
            bin/porteria-agent-linux-arm64
            bin/porteria-agent-macos-arm64
            bin/install.ps1
            bin/uninstall.ps1
            bin/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Subir artefactos al run (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sync-agent-binaries
          path: bin/
          retention-days: 7
